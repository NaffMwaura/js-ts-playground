<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Developer Learning Directory</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div class="container">
    <header>
      <h1>Engineering Resource Hub</h1>
      <p>Loaded asynchronously from data.json using JavaScript fetch</p>
    </header>

    <section class="controls-bar">
      <div class="search-box">
        <input 
          type="text" 
          id="searchInput" 
          placeholder="Search by topic, title, or tag..." 
          autocomplete="off"
        />
      </div>
      <div class="filter-box">
        <select id="categorySelect">
          <option value="ALL">All Categories</option>
          <option value="Backend">Backend</option>
          <option value="Frontend">Frontend</option>
          <option value="DevOps">DevOps</option>
        </select>
      </div>
    </section>

    <!-- State Messages (Loading / Error / Empty) -->
    <div id="statusContainer" class="status-msg">Connecting to data stream...</div>

    <!-- Dynamic Output Grid -->
    <main id="cardsContainer" class="cards-grid"></main>
  </div>

  <script src="app.js" defer></script>
</body>
</html>
